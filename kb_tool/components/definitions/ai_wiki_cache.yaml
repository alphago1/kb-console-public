# AI Wiki 缓存策略定义
# 控制 AI 如何维护和使用压缩版 wiki 缓存

component_id: ai_wiki_cache
policy_version: v1
human_facing: false
ai_facing: true

cache:
  format: JSON
  location: "kb_out/cache/wiki_cache.json"
  max_size_chars: 100000

update_triggers:
  - 新文件摄入后 → 增量更新受影响 topic
  - 每月全量 review → 全量重建缓存
  - 用户反馈修改 → 立即更新对应条目

structure:
  topics:
    - topic_id
    - topic_name
    - summary (500 chars max)
    - key_claims (每条 200 chars)
    - source_refs (文件名 + chunk_index)
    - last_updated
  projects:
    - project_id
    - project_name
    - status
    - summary
    - related_topics
  profile:
    - domains
    - decision_patterns
    - open_questions
    - last_updated

usage:
  - Agent 工具调用时优先读取 cache 而非全量 wiki
  - Context Bundle 构建时优先使用 cache 中的 summary
  - MCP 工具返回结果时引用 cache 中的 topic_id
